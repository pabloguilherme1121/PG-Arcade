name: Validate and publish PG Arcade
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - uses: actions/upload-artifact@v7
        with:
          name: arcade-dist
          path: dist
          retention-days: 7

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: arcade-dist
          path: dist
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: arcade-${{ matrix.browser }}-failure-diagnostics
          path: test-results
          retention-days: 7

  validate:
    name: validate
    if: ${{ always() }}
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require quality and all browser jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          echo "Quality result: $QUALITY_RESULT"
          echo "Browser matrix result: $E2E_RESULT"
          if [ "$QUALITY_RESULT" != "success" ] || [ "$E2E_RESULT" != "success" ]; then
            echo "::error::Quality and all browser jobs must succeed. Inspect the failed or cancelled upstream job."
            exit 1
          fi

  pages-artifact:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: arcade-dist
          path: dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: pages-artifact
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
